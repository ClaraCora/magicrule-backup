name: Sync and publish

on:
  schedule:
    - cron: '17 20 * * *' # 04:17 Asia/Shanghai (UTC+8)
  workflow_dispatch:
    inputs:
      sync:
        description: 'Refresh the five upstream inputs before publishing'
        type: boolean
        default: true
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: magicrule-production
  cancel-in-progress: false

jobs:
  sync-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    outputs:
      upstream: ${{ steps.refresh.outcome }}
    permissions:
      contents: write
      pages: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Prepare data worktree
        run: npm run prepare:data
      - name: Migrate the published rules to the existing custom paths
        run: npm run migrate:data
      - name: Refresh the five upstream inputs
        id: refresh
        if: github.event_name != 'workflow_dispatch' || inputs.sync
        continue-on-error: true
        run: npm run sync
      - name: Verify subscriptions and build website
        run: npm run verify && npm run build
      - name: Commit validated subscriptions
        run: |
          git -C .cache/backup config user.name 'github-actions[bot]'
          git -C .cache/backup config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C .cache/backup add --all
          if ! git -C .cache/backup diff --cached --quiet; then
            git -C .cache/backup commit -m "rules: publish verified subscriptions $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            git -C .cache/backup push origin HEAD:data
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: sync-and-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
  upstream-result:
    needs: [sync-and-build, deploy]
    if: needs.sync-and-build.outputs.upstream == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Report upstream refresh failure
        run: |
          echo "::error::The upstream refresh failed. The last verified subscriptions remain published. See the refresh step for details."
          exit 1
