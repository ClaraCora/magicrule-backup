name: Checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check && npm test
      - name: Load published backup for a build check
        run: npm run prepare:data
      - run: npm run migrate:names && npm run verify
      - run: npm run build
